<!DOCTYPE html>
<!-- 檔案：amba 正式場圖座位表｜版本：2026-11-10 -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>amba 座位表｜想樂創意</title>
<style>
:root{--g:#9D380E;--g2:#b0491c;--blue:#6BA1C7;--bg:#faf6f3;--line:#e8d6cc;--ink:#3a2a22;--mute:#8a7568;--ok:#4f8a5b;--warn:#c27a1a;--bad:#c0392b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif;font-size:15px}
header{background:linear-gradient(90deg,#8a3009,#b0491c);color:#fff;padding:14px 16px}
header h1{margin:0;font-size:18px}
header .sub{font-size:13px;opacity:.9;margin-top:3px}
.wrap{max-width:980px;margin:0 auto;padding:12px 16px 80px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.stat{font-size:14px}.stat b{color:var(--g);font-size:16px}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;background:#f3e7e0;color:var(--g)}
.save-status{margin-left:auto;font-size:12px;color:var(--mute)}
.save-status.error{color:var(--bad)}
.notice{background:#fff8f4;border:1px solid #f0d5c6;border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:10px;line-height:1.6}
.notice.bad{background:#fdf0ee;border-color:#f1c3bc;color:var(--bad)}
.mapbox{background:#fff;border:1px solid var(--line);border-radius:10px;overflow:auto;position:relative;max-height:78vh;-webkit-overflow-scrolling:touch}
.map{position:relative;width:100%;transform-origin:0 0;user-select:none;-webkit-user-select:none}
.map img{display:block;width:100%;pointer-events:none}
.mk{position:absolute;transform:translate(-50%,-50%);min-width:30px;padding:3px 7px;border-radius:99px;font-size:12px;font-weight:600;line-height:1.25;text-align:center;white-space:nowrap;cursor:pointer;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);color:#fff;background:#9c8f88;touch-action:none}
.mk small{display:block;font-weight:400;font-size:10px;opacity:.95}
.mk.part{background:var(--warn)}.mk.full{background:var(--ok)}.mk.over{background:var(--bad)}
.mk.zone{background:rgba(107,161,199,.92);border-style:dashed}
.mk.sel{outline:3px solid var(--g);outline-offset:1px}
.mk{z-index:2}
.st{position:absolute;transform:translate(-50%,-50%);width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid #9D380E;cursor:pointer;z-index:1;box-sizing:border-box}
.st.f{background:#2e8b57;border-color:#fff}
.st.hl,.cd.hl b{box-shadow:0 0 0 3px #6BA1C7}
.crop{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
.crop img{position:absolute;max-width:none;pointer-events:none;opacity:.55}
.cd{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;cursor:pointer;z-index:1}
.cd b{width:18px;height:18px;border-radius:50%;background:#fff;border:1.5px solid #9D380E;color:#9D380E;font-size:10px;line-height:15px;text-align:center;box-sizing:border-box}
.cd.f b{background:#2e8b57;border-color:#2e8b57;color:#fff}
.cd i{font-style:normal;font-size:9px;line-height:1.1;background:rgba(255,255,255,.9);padding:0 2px;border-radius:3px;max-width:36px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;margin-top:1px}
.cd i:empty{display:none}
.chint{font-size:12px;color:var(--mute);margin:-2px 0 6px}
.card.wide{grid-column:1/-1}.card.wide .seats{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.si{display:flex;align-items:center;gap:4px}.si>em{font-style:normal;font-size:11px;font-weight:700;color:#9D380E;min-width:18px;text-align:right}
.zoombar{display:flex;gap:6px;margin:8px 0}
button,.btn{font:inherit;font-size:13px;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
button.pri{background:var(--g);border-color:var(--g);color:#fff}
button.on{background:var(--blue);border-color:var(--blue);color:#fff}
button.danger{color:var(--bad);border-color:#f1c3bc}
h2{font-size:16px;margin:18px 0 8px;color:var(--g)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.card.hl{box-shadow:0 0 0 3px var(--blue)}
.card .hd{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.card .hd b{font-size:15px}
.card .hd .cnt{margin-left:auto;font-size:12px;color:var(--mute)}
.card .hd .cnt.over{color:var(--bad);font-weight:600}
.seats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.seats input,.card textarea,.card input.note{width:100%;min-width:0;font:inherit;font-size:14px;padding:6px 8px;border:1px solid #e3d3c9;border-radius:6px;background:#fffdfb}
.seats input:focus,.card textarea:focus{outline:2px solid var(--blue);border-color:transparent}
.card textarea{min-height:52px;margin-top:6px;resize:vertical}
.zdesc{font-size:13px;color:var(--mute);margin-bottom:4px;white-space:pre-wrap}
.addseat{margin-top:6px;font-size:12px;padding:4px 8px}
.fl{flex:none;font:inherit;font-size:11px;padding:3px 5px;border:1px solid #e3d3c9;border-radius:6px;background:#fff;color:#b9a79c;cursor:pointer}
.fl.on.kid{background:#6BA1C7;border-color:#6BA1C7;color:#fff}.fl.on.veg{background:#2e8b57;border-color:#2e8b57;color:#fff}
.tno{width:58px;flex:none;font:inherit;font-size:15px;font-weight:700;color:#9D380E;text-align:center;padding:4px 4px;border:1px solid #e3d3c9;border-radius:6px;background:#fffdfb}
.ttl{flex:1;min-width:0;font:inherit;font-size:14px;padding:4px 8px;border:1px solid #e3d3c9;border-radius:6px;background:#fffdfb}
.cd s{position:absolute;top:-6px;right:-9px;text-decoration:none;font-size:8px;line-height:11px;padding:0 2px;border-radius:3px;color:#fff;background:#6BA1C7}
.cd s.v{right:auto;left:-9px;background:#2e8b57}
.st.k{border-color:#6BA1C7}.st.v{box-shadow:0 0 0 2px #2e8b57}
.fhint{font-size:12px;color:var(--mute);margin:2px 0 6px}
.over-row input{border-color:var(--bad)!important}
.panel{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:2px solid var(--g);box-shadow:0 -4px 16px rgba(0,0,0,.15);padding:12px 16px calc(12px + env(safe-area-inset-bottom));z-index:20;display:none}
.panel.show{display:block}
.panel .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px}
.panel label{font-size:13px;color:var(--mute)}
.panel input,.panel select,.panel textarea{font:inherit;font-size:14px;padding:6px 8px;border:1px solid #e3d3c9;border-radius:6px}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:30}
.dlg{background:#fff;border-radius:12px;padding:18px;width:min(340px,92vw)}
.dlg input{width:100%;font:inherit;padding:8px;border:1px solid #e3d3c9;border-radius:6px;margin:10px 0}
.empty{text-align:center;padding:40px 16px;color:var(--mute);background:#fff;border:1px solid var(--line);border-radius:10px}
.pool span{display:inline-block;background:#f3e7e0;border-radius:6px;padding:2px 8px;margin:2px;font-size:13px}
@media print{
  header{background:none;color:#000;padding:0 0 6px}.bar button,.zoombar,.panel,.tools,.addseat,.no-print,.save-status,.fl:not(.on){display:none!important}.ttl,.tno{border:none;padding:0;font-weight:700}
  .mapbox{max-height:none;overflow:visible;border:none}.map{width:100%!important}
  .wrap{padding:0;max-width:none}.cards{grid-template-columns:repeat(3,1fr);gap:6px}
  .card{break-inside:avoid;padding:6px 8px}.seats input{border:none;border-bottom:1px solid #ccc;border-radius:0;padding:2px 4px;font-size:12px}
  .card textarea{border:none;min-height:0;font-size:12px}
}
</style>
</head>
<body>
<header><h1 id="ttl">amba 座位表</h1><div class="sub" id="sub">載入中…</div></header>
<div class="wrap">
  <div id="staffBar" class="notice no-print" style="display:none"></div>
  <div class="bar">
    <span class="stat">已填 <b id="sFilled">0</b> 位</span>
    <span class="stat">座位 <b id="sCap">0</b> 位</span>
    <span class="stat" id="sForm"></span>
    <span class="stat" id="sFlags"></span>
    <button class="no-print" onclick="window.print()">🖨 列印／存 PDF</button>
    <span class="save-status" id="saveStatus"></span>
  </div>
  <div id="warn"></div>
  <div id="main"><div class="empty">載入中…</div></div>
</div>
<div class="panel" id="panel"></div>
<script>
(function(){
'use strict';
var BASE_URL = 'https://script.google.com/macros/s/AKfycbwV3pXKiwOBCbvv_W0ysv1_mjGsAnK4VqKQI5-jAbjDWGgEaBpVJufiszaVhYsc73Lg/exec';
var TOKEN = (location.search.match(/[?&]token=([^&]+)/) || [])[1]; TOKEN = TOKEN ? decodeURIComponent(TOKEN) : '';
var STAFF = /staff/.test(location.hash) || /[?&]staff=1/.test(location.search);
var PW = ''; try { PW = sessionStorage.getItem('wfAmbaPw') || ''; } catch (e) {}
var ORDER = {}, FORM = {}, SEAT = null, LOADED = false, ZOOM = 1, SEL = null, TOOL = null, HL = null, PTSID = null, AR = 0;
var $ = function (id) { return document.getElementById(id); };
var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
var driveId = function (u) { return (String(u || '').match(/\/d\/([\w-]+)/) || String(u || '').match(/[?&]id=([\w-]+)/) || [])[1] || ''; };
var imgUrl = function (id) { return 'https://lh3.googleusercontent.com/d/' + id; };
var now = function () { var d = new Date(); return d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
function setStatus(cls, msg) { var el = $('saveStatus'); el.className = 'save-status ' + cls; el.textContent = msg; }
function blank() { return { v: 'map', plan: null, tables: {} }; }
function items() { return (SEAT && SEAT.plan && SEAT.plan.items) || {}; }
function ids() {
  var it = items();
  return Object.keys(it).sort(function (a, b) {
    var ka = it[a].kind === 'zone' ? 1 : 0, kb = it[b].kind === 'zone' ? 1 : 0;
    return ka - kb || String(it[a].label).localeCompare(String(it[b].label), 'zh-Hant', { numeric: true });
  });
}
function tbl(id) { SEAT.tables = SEAT.tables || {}; var t = SEAT.tables[id] = SEAT.tables[id] || {}; t.seats = t.seats || []; return t; }
function filled(id) { var t = (SEAT.tables || {})[id]; return t && t.seats ? t.seats.filter(function (s) { return s && String(s.name || '').trim(); }).length : 0; }
function newId() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5); }

// ── 載入 ──
function load() {
  if (!TOKEN) { $('main').innerHTML = '<div class="empty">連結無效，請聯繫想樂創意。</div>'; return; }
  fetch(BASE_URL + '?token=' + encodeURIComponent(TOKEN) + '&action=getSeatData&_=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    ORDER = d.order || {}; FORM = d.form || {};
    SEAT = (d.seat && d.seat.v === 'map') ? d.seat : (d.seat ? null : blank());
    if (!SEAT) { $('main').innerHTML = '<div class="empty">這組已使用其他格式的座位表，請聯繫想樂創意。</div>'; return; }
    SEAT.tables = SEAT.tables || {};
    SY_BASE = JSON.stringify(SEAT); LOADED = true;
    $('ttl').textContent = (ORDER.groomName || '') + ' & ' + (ORDER.brideName || '') + '｜座位表';
    $('sub').textContent = [ORDER.weddingDate, ORDER.venueName || 'amba', ORDER.mealSession].filter(Boolean).join('｜');
    document.title = $('ttl').textContent + '｜想樂創意';
    if (STAFF && !PW) askPw(); else render();
  }).catch(function (e) { $('main').innerHTML = '<div class="empty">載入失敗，請重新整理（' + esc(e.message) + '）</div>'; });
}

// ── 想樂專用密碼 ──
function post(body) {
  return fetch(BASE_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }).then(function (r) { return r.json(); });
}
function askPw(msg) {
  var m = document.createElement('div'); m.className = 'mask';
  m.innerHTML = '<div class="dlg"><b>想樂專用：標桌模式</b><div style="font-size:13px;color:#8a7568;margin-top:4px">' + (msg || '請輸入想樂專用密碼') + '</div><input type="password" id="pwIn" autocomplete="off"><div style="display:flex;gap:8px;justify-content:flex-end"><button id="pwNo">只看不編輯</button><button class="pri" id="pwOk">進入</button></div></div>';
  document.body.appendChild(m);
  var go = function () {
    var v = $('pwIn').value; $('pwOk').disabled = true;
    post({ token: TOKEN, action: 'checkStaff', pw: v }).then(function (r) {
      m.remove();
      if (r && r.success) { PW = v; try { sessionStorage.setItem('wfAmbaPw', v); } catch (e) {} render(); }
      else askPw('密碼不正確，請再試一次');
    }).catch(function (e) { m.remove(); askPw('驗證失敗：' + e.message); });
  };
  $('pwOk').onclick = go; $('pwIn').onkeydown = function (e) { if (e.key === 'Enter') go(); };
  $('pwNo').onclick = function () { m.remove(); STAFF = false; render(); };
  setTimeout(function () { $('pwIn').focus(); }, 50);
}
function staffOn() { return STAFF && !!PW; }

// ── 畫面 ──
function render() {
  var plan = SEAT.plan, edit = staffOn();
  var latestImg = driveId(ORDER.layoutPlanUrl);
  var img = edit ? (latestImg || (plan && plan.img)) : (plan && plan.img);
  var sb = $('staffBar');
  if (edit) {
    sb.style.display = 'block';
    sb.innerHTML = '<b>📍 標桌模式（想樂專用）</b>　選下方工具後點場圖新增；拖曳可移動；點標記可修改或刪除。改完會自動儲存。' +
      (plan && plan.img && latestImg && plan.img !== latestImg ? '<div style="color:#c0392b;margin-top:4px">⚠️ 正式場圖已更換，請確認標記位置，確認後按 <button onclick="WF.applyImg()">套用新場圖</button>（新人才會看到新圖）</div>' : '') +
      '<div class="tools" style="margin-top:8px"><span style="font-size:13px">新增：</span>' +
      ['8', '10', '12', '16'].map(function (n) { return '<button data-tool="t' + n + '" onclick="WF.tool(\'t' + n + '\')">' + n + 'P 桌</button>'; }).join('') +
      '<button data-tool="tc" onclick="WF.tool(\'tc\')">自訂人數</button><button data-tool="z" onclick="WF.tool(\'z\')">區域（不排座位）</button>' +
      '<span id="planSt" style="font-size:12px;color:#8a7568;margin-left:6px"></span></div>' +
      '<div class="tools" style="margin-top:8px"><button class="pri" onclick="WF.autoSeats()">🤖 自動偵測座位</button><span style="font-size:12px;color:#8a7568">先把每一桌標在桌子中央、設好人數，再按這裡；會依場圖上的椅子自動排座位編號（由上到下、由左到右）</span></div>' +
      '<div id="autoSt" style="font-size:13px;margin-top:6px"></div>';
  } else sb.style.display = 'none';

  if (!img) { $('main').innerHTML = '<div class="empty">正式場圖準備中，完成後想樂創意會通知您填寫座位表 🙏</div>'; stats(); return; }
  if (!edit && !ids().length) { $('main').innerHTML = '<div class="empty">正式場圖已收到，想樂創意正在標註桌位，完成後即可在這裡填寫座位 🙏</div>'; stats(); return; }

  var h = '<div class="zoombar no-print"><button onclick="WF.zoom(-1)">－ 縮小</button><button onclick="WF.zoom(1)">＋ 放大</button>' + (edit ? '' : '<span style="font-size:12px;color:#8a7568;align-self:center">點桌號可直接跳到該桌填寫</span>') + '</div>';
  if (!AR && plan && plan.ar) AR = plan.ar;
  h += '<div class="mapbox" id="mapbox"><div class="map" id="map" style="width:' + (ZOOM * 100) + '%"><img id="mapImg" src="' + imgUrl(img) + '" alt="正式場圖" onload="WF.ar(this)">';
  ids().forEach(function (id) { h += dotsHtml(id) + mkHtml(id); });
  h += '</div></div>';
  var tables = ids().filter(function (id) { return items()[id].kind !== 'zone'; }), zones = ids().filter(function (id) { return items()[id].kind === 'zone'; });
  h += '<h2>桌次名單</h2><div class="cards">' + tables.map(cardHtml).join('') + '</div>';
  if (zones.length) h += '<h2>區域需求</h2><div class="cards">' + zones.map(cardHtml).join('') + '</div>';
  var pool = Object.keys(SEAT.tables || {}).filter(function (id) { return !items()[id] && filled(id); });
  if (pool.length) h += '<h2>未安排的名單</h2><div class="notice">場圖調整後，以下名單原本的桌次已取消，請重新填到新的桌次。<div class="pool" style="margin-top:6px">' + pool.map(function (id) { return SEAT.tables[id].seats.filter(function (s) { return s && s.name; }).map(function (s) { return '<span>' + esc(s.name) + '</span>'; }).join(''); }).join('') + '</div><button style="margin-top:6px" onclick="WF.clearPool()">已重新安排，清除這區</button></div>';
  $('main').innerHTML = h;
  bindMap(); stats();
  if (HL) { var c = $('card_' + HL); if (c) c.classList.add('hl'); }
}
function mkHtml(id) {
  var it = items()[id], n = filled(id), cap = +it.cap || 0;
  var cls = it.kind === 'zone' ? 'zone' : (n === 0 ? '' : n > cap ? 'over' : n === cap ? 'full' : 'part');
  var tb = (SEAT.tables || {})[id] || {}, tt = it.kind === 'zone' ? '' : String(tb.title || '').trim(), no = it.kind === 'zone' ? '' : String(tb.no || '').trim();
  return '<div class="mk ' + cls + (SEL === id ? ' sel' : '') + '" data-id="' + id + '" style="left:' + it.x + '%;top:' + it.y + '%">' + esc(no || it.label) + (tt ? '<small>' + esc(tt.length > 6 ? tt.slice(0, 6) + '…' : tt) + '</small>' : '') + (it.kind === 'zone' ? '' : '<small>' + n + '/' + cap + '</small>') + '</div>';
}
function pts(id) { var p = items()[id] && items()[id].pts; return Array.isArray(p) ? p : []; }
function seatF(id, i, f) { var t = (SEAT.tables || {})[id]; return !!(t && t.seats && t.seats[i] && t.seats[i][f]); }
function seatName(id, i) { var t = (SEAT.tables || {})[id]; return (t && t.seats && t.seats[i] && String(t.seats[i].name || '').trim()) || ''; }
function dotsHtml(id) {
  return pts(id).map(function (p, i) { var nm = seatName(id, i); return '<div class="st' + (nm ? ' f' : '') + (seatF(id, i, 'kid') ? ' k' : '') + (seatF(id, i, 'veg') ? ' v' : '') + '" data-sid="' + id + '" data-si="' + i + '" style="left:' + p[0] + '%;top:' + p[1] + '%" title="' + (i + 1) + (nm ? '　' + esc(nm) : '') + '"></div>'; }).join('');
}
function cropHtml(id) {
  var P = pts(id); if (!P.length || !AR) return '';
  var xs = P.map(function (p) { return p[0]; }), ys = P.map(function (p) { return p[1]; });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs), y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  var W = Math.max(x1 - x0 + 6, 16), H = Math.max(y1 - y0 + 9, (W * 0.35) / AR);
  var cx = (x0 + x1) / 2, cy = (y0 + y1) / 2; x0 = cx - W / 2; y0 = cy - H / 2;
  var h = '<div class="chint">下圖是這桌的實際座位位置，編號對應下方格子</div><div class="crop" style="padding-top:' + (H * AR / W * 100).toFixed(2) + '%"><img src="' + imgUrl(SEAT.plan.img) + '" style="width:' + (10000 / W).toFixed(2) + '%;left:' + (-x0 / W * 100).toFixed(2) + '%;top:' + (-y0 / H * 100).toFixed(2) + '%">';
  P.forEach(function (p, i) { var nm = seatName(id, i); h += '<div class="cd' + (nm ? ' f' : '') + '" data-cid="' + id + '" data-ci="' + i + '" style="left:' + ((p[0] - x0) / W * 100).toFixed(2) + '%;top:' + ((p[1] - y0) / H * 100).toFixed(2) + '%"><b>' + (i + 1) + '</b>' + (seatF(id, i, 'kid') ? '<s>童</s>' : '') + (seatF(id, i, 'veg') ? '<s class="v">素</s>' : '') + '<i>' + esc(nm) + '</i></div>'; });
  return h + '</div>';
}
function seatHl(id, i) {
  document.querySelectorAll('.st.hl,.cd.hl').forEach(function (e) { e.classList.remove('hl'); });
  if (id == null) return;

    var t = tbl(el.dataset.t), i = +el.dataset.i;
    while (t.seats.length <= i) t.seats.push({ name: '' });
    var prev = t.seats[i] || {}; t.seats[i] = { name: el.value }; if (prev.kid) t.seats[i].kid = true; if (prev.veg) t.seats[i].veg = true;
    var nm = el.value.trim();
    document.querySelectorAll('[data-cid="' + el.dataset.t + '"][data-ci="' + i + '"]').forEach(function (c) { c.classList.toggle('f', !!nm); c.querySelector('i').textContent = nm; });
    refreshCardCount(el.dataset.t); refreshMarks(); seatHl(el.dataset.t, i); scheduleSave();
  } else if (el.dataset.note !== undefined) { tbl(el.dataset.note).note = el.value; scheduleSave(); }
  else if (el.dataset.tno !== undefined) { tbl(el.dataset.tno).no = el.value.trim(); refreshMarks(); scheduleSave(); }
  else if (el.dataset.title !== undefined) { tbl(el.dataset.title).title = el.value; refreshMarks(); scheduleSave(); }
});

document.addEventListener('focusin', function (e) { var el = e.target; if (el.dataset && el.dataset.t !== undefined && el.dataset.i !== undefined) seatHl(el.dataset.t, +el.dataset.i); });
document.addEventListener('click', function (e) {
  var b = e.target.closest && e.target.closest('.fl'); if (!b) return;
  e.preventDefault();
  var id = b.dataset.ft, i = +b.dataset.fi, f = b.dataset.fl, t = tbl(id);
  while (t.seats.length <= i) t.seats.push({ name: '' });
  var x = t.seats[i] = t.seats[i] || { name: '' };
  if (x[f]) delete x[f]; else x[f] = true;
  var c = $('card_' + id), y = window.scrollY; if (c) c.outerHTML = cardHtml(id);
  window.scrollTo(0, y); refreshMarks(); seatHl(id, i); scheduleSave();
});
document.addEventListener('click', function (e) { var c = e.target.closest && e.target.closest('.cd'); if (c) { var f = document.querySelector('input[data-t="' + c.dataset.cid + '"][data-i="' + c.dataset.ci + '"]'); if (f) f.focus(); } });

// ── 存檔與多人同步（與其他場地座位表同一套） ──
var SY_BASE = null, SY_SAVING = false, saveTimer = null;
function scheduleSave() { if (!LOADED || !SEAT.plan) return; clearTimeout(saveTimer); setStatus('saving', '編輯中…'); saveTimer = setTimeout(doSave, 1200); }
function syFlat(o, p, m) {
  m = m || {};
  if (Array.isArray(o)) { m[p + '@a'] = String(o.length); o.forEach(function (v, i) { syFlat(v, p + '.' + i, m); }); }
  else if (o && typeof o === 'object') { m[p + '@o'] = '1'; Object.keys(o).forEach(function (k) { syFlat(o[k], p + '.' + k, m); }); }
  else m[p] = JSON.stringify(o === undefined ? null : o);
  return m;
}
function syUnflat(m) {
  var kids = {};
  Object.keys(m).forEach(function (k) { var b = k.replace(/@[ao]$/, ''), i = b.lastIndexOf('.'); if (i < 0) return; (kids[b.slice(0, i)] = kids[b.slice(0, i)] || {})[b.slice(i + 1)] = 1; });
  function has(q) { return m[q] !== undefined || m[q + '@a'] !== undefined || m[q + '@o'] !== undefined; }
  function build(p) {
    if (m[p + '@a'] !== undefined) { var n = +m[p + '@a'], a = []; for (var i = 0; i < n; i++) a.push(has(p + '.' + i) ? build(p + '.' + i) : null); return a; }
    if (m[p + '@o'] !== undefined) { var o = {}; Object.keys(kids[p] || {}).forEach(function (s) { if (has(p + '.' + s)) o[s] = build(p + '.' + s); }); return o; }
    return m[p] !== undefined ? JSON.parse(m[p]) : null;
  }
  return build('');
}
function syMerge(base, mine, theirs) {
  var b = syFlat(base, ''), l = syFlat(mine, ''), r = syFlat(theirs, ''), out = {}, keys = {};
  [b, l, r].forEach(function (o) { Object.keys(o).forEach(function (k) { keys[k] = 1; }); });
  Object.keys(keys).forEach(function (k) { var v = l[k] === b[k] ? r[k] : l[k]; if (v !== undefined) out[k] = v; });
  return syUnflat(out);
}
function syFetch() { return fetch(BASE_URL + '?token=' + encodeURIComponent(TOKEN) + '&action=getSeatData&_=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) { return (d && d.seat) || null; }); }
function sySync(remote) {
  if (!remote || remote.v !== 'map') return false;
  var rs = JSON.stringify(remote); if (SY_BASE === null || rs === SY_BASE) return false;
  var mine = JSON.parse(JSON.stringify(SEAT)), merged = syMerge(JSON.parse(SY_BASE), mine, remote);
  SY_BASE = rs;
  if (JSON.stringify(merged) === JSON.stringify(mine)) return false;
  SEAT = merged; SEAT.tables = SEAT.tables || {}; render();
  setStatus('saved', '↻ 已同步另一位的修改 ' + now());
  return true;
}
function doSave() {
  saveTimer = null;
  if (SY_SAVING) { scheduleSave(); return; }
  var str = JSON.stringify(SEAT);
  if (str === SY_BASE) { setStatus('saved', '✓ 已儲存'); return; }
  SY_SAVING = true; setStatus('saving', '儲存中…');
  post({ token: TOKEN, action: 'saveSeatData', seat: JSON.parse(str), base: JSON.parse(SY_BASE) })
    .then(function (r) { if (r && r.success === false) throw new Error(r.error || '伺服器拒絕'); return syFetch(); })
    .then(function (remote) { SY_BASE = str; sySync(remote); SY_SAVING = false; setStatus('saved', '✓ 已儲存 ' + now()); })
    .catch(function (e) { SY_SAVING = false; setStatus('error', '儲存失敗：' + e.message + '（稍後自動重試）'); setTimeout(scheduleSave, 8000); });
}
function syBusy() { var a = document.activeElement; return !!(a && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA' || a.tagName === 'SELECT')) || $('panel').classList.contains('show') || !!planTimer || !!document.querySelector('.mask'); }
function syPoll() { if (!LOADED || SY_SAVING || saveTimer || document.hidden || syBusy()) return; syFetch().then(function (r) { if (!SY_SAVING && !saveTimer && !syBusy()) sySync(r); }).catch(function () {}); }
setInterval(syPoll, 6000);
document.addEventListener('visibilitychange', function () { if (!document.hidden) syPoll(); });
window.addEventListener('beforeunload', function (e) { if (saveTimer || SY_SAVING || planTimer) { e.preventDefault(); e.returnValue = ''; } });

window.WF = {
  zoom: function (d) { ZOOM = Math.max(1, Math.min(3, ZOOM + d * 0.5)); var m = $('map'); if (m) m.style.width = (ZOOM * 100) + '%'; },
  tool: function (t) { TOOL = TOOL === t ? null : t; document.querySelectorAll('[data-tool]').forEach(function (b) { b.classList.toggle('on', b.dataset.tool === TOOL); }); },
  closePanel: closePanel,
  del: function () { if (!SEL || !confirm('刪除「' + items()[SEL].label + '」？')) return; delete SEAT.plan.items[SEL]; closePanel(); savePlan(); },
  clearPool: function () { if (!confirm('確定已重新安排？這區名單會清除。')) return; Object.keys(SEAT.tables).forEach(function (id) { if (!items()[id]) delete SEAT.tables[id]; }); render(); scheduleSave(); },
  ar: function (img) { if (!img.naturalWidth) return; var a = Math.round(img.naturalHeight / img.naturalWidth * 10000) / 10000; if (a !== AR) { AR = a; if (!$('panel').classList.contains('show')) render(); } },
  ptsMode: function () { if (!SEL) return; PTSID = PTSID === SEL ? null : SEL; if (PTSID) { TOOL = null; document.querySelectorAll('[data-tool]').forEach(function (b) { b.classList.remove('on'); }); } ptsSt(); },
  ptsUndo: function () { if (!SEL) return; var it = items()[SEL]; it.pts = pts(SEL).slice(0, -1); refreshMarks(); ptsSt(); savePlan(); },
  ptsClear: function () { if (!SEL || !confirm('清除這桌所有座位點？')) return; items()[SEL].pts = []; refreshMarks(); ptsSt(); savePlan(); },
  autoSeats: autoSeats,
  importItems: function (list, replace) { if (!staffOn()) return false; SEAT.plan = SEAT.plan || { img: driveId(ORDER.layoutPlanUrl), items: {} }; if (replace) SEAT.plan.items = {}; list.forEach(function (o) { SEAT.plan.items[newId()] = { kind: o.kind || 'table', label: String(o.label), cap: +o.cap || 0, note: o.note || '', x: o.x, y: o.y }; }); savePlan(); render(); return true; },
  info: function () { return { planImg: SEAT.plan && SEAT.plan.img, latest: driveId(ORDER.layoutPlanUrl) }; },
  setPts: function (id, list) { if (!staffOn() || !items()[id]) return false; items()[id].pts = list; savePlan(); render(); return true; },
  ids: function () { return ids().map(function (id) { return { id: id, label: items()[id].label, kind: items()[id].kind, cap: items()[id].cap }; }); },
  applyImg: function () { SEAT.plan.img = driveId(ORDER.layoutPlanUrl); render(); savePlan(); }
};
load();
})();
